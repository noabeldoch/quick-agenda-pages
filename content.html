<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Quick Agenda</title>
  <script src="https://unpkg.com/@microsoft/teams-js@2/dist/MicrosoftTeams.min.js"></script>
  <style>
    body { font-family: 'Segoe UI', sans-serif; margin: 0; padding: 12px; }
    h2 { margin: 0 0 8px; font-size: 16px; }
    li { margin: 6px 0; }
    iframe { border: 0; width: 100%; height: 100vh; }
  </style>
</head>
<body>
  <div id="app">
    <h2>📋 Quick Agenda</h2>
    <ul id="agenda"><li>Waiting for agenda…</li></ul>
  </div>
  <script>
    microsoftTeams.app.initialize().catch(function () {});
    // If you pass ?src=<https url> Teams will full-panel embed your real live-agenda site.
    var src = new URLSearchParams(location.search).get("src");
    if (src) {
      document.body.innerHTML = '<iframe src="' + src + '"></iframe>';
    }
  </script>
</body>
</html>
