<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Quick Agenda — Configure</title>
  <script src="https://res.cdn.office.net/teams-js/2.24.0/js/MicrosoftTeams.min.js"></script>
  <style>
    :root { --bg:#fff; --fg:#242424; --muted:#616161; --card:#f5f5f5; --border:#e0e0e0; --accent:#8A2BE2; --code-bg:#efe7fb; }
    html[data-theme="dark"], html[data-theme="contrast"] { --bg:#1f1f1f; --fg:#fff; --muted:#adadad; --card:#2d2d2d; --border:#3d3d3d; --accent:#b388ff; --code-bg:#3a2f4d; }
    * { box-sizing: border-box; }
    body { margin:0; padding:14px; font-family:'Segoe UI',system-ui,sans-serif; background:var(--bg); color:var(--fg); font-size:14px; line-height:1.45; }
    .title { margin:0 0 6px; font-size:16px; font-weight:600; }
    p { margin:0 0 10px; }
    .muted { color:var(--muted); font-size:12.5px; }
    .email-row { display:flex; align-items:center; gap:6px; flex-wrap:wrap; margin:8px 0; }
    code.email { background:var(--code-bg); padding:4px 8px; border-radius:6px; font-size:13px; word-break:break-all; }
    button.copy { border:1px solid var(--border); background:transparent; color:var(--accent); border-radius:6px; padding:3px 9px; font-size:12px; cursor:pointer; }
    button.copy:hover { background:var(--card); }
  </style>
</head>
<body>
  <h2 class="title">📋 Quick Agenda</h2>
  <p>Invite our bot and start live transcription — the agenda then tracks live here for everyone.</p>
  <div class="email-row">
    <code class="email" id="botEmail">hack-g4-bot@meetings.quick.aws.dev</code>
    <button class="copy" onclick="copyEmail()">Copy</button>
  </div>
  <p class="muted">Then: <b>More (…) → Record and transcribe → Start transcription</b>. Click <b>Save</b> to add.</p>

  <script>
    var CONTENT_URL = "https://djhog3mmjjbr1.cloudfront.net/live/";
    function applyTheme(t){ document.documentElement.setAttribute("data-theme", t === "default" ? "light" : t); }
    function copyEmail(){
      var t = document.getElementById("botEmail").textContent.trim();
      navigator.clipboard && navigator.clipboard.writeText(t);
      var b = document.querySelector("button.copy"); if(b){ var o=b.textContent; b.textContent="Copied!"; setTimeout(function(){ b.textContent=o; },1500); }
    }
    if (window.microsoftTeams) {
      microsoftTeams.app.initialize().then(function () {
        microsoftTeams.app.getContext().then(function (c){ applyTheme((c&&c.app&&c.app.theme)||"default"); }).catch(function(){});
        microsoftTeams.app.registerOnThemeChangeHandler(applyTheme);
        microsoftTeams.pages.config.registerOnSaveHandler(function (e) {
          microsoftTeams.pages.config.setConfig({
            entityId: "quickAgenda", contentUrl: CONTENT_URL, websiteUrl: CONTENT_URL, suggestedDisplayName: "Quick Agenda"
          }).then(function(){ e.notifySuccess(); }).catch(function(err){ e.notifyFailure(String(err)); });
        });
        microsoftTeams.pages.config.setValidityState(true);
      }).catch(function(){});
    }
  </script>
</body>
</html>
